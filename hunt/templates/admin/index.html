{% extends "admin/index.html" %}
{% load i18n static %}

{% block content %}
<div style="margin-bottom: 30px; padding: 30px; background: #3A3A3A; border-radius: 0; box-shadow: 0 4px 8px rgba(0,0,0,0.3); border-left: 8px solid #FF8247;">
    <h2 style="margin: 0 0 15px 0; color: #FF8247; font-size: 32px; font-weight: 900; text-transform: uppercase; letter-spacing: 2px;">ESCAPE THE CITY</h2>
    <p style="margin: 0 0 20px 0; color: white; font-size: 16px; font-weight: bold;">Bekijk realtime voortgang van alle groepen over alle posts</p>
    <a href="{% url 'overview' %}"
       style="display: inline-block; padding: 15px 30px; background-color: #FF8247; color: #3A3A3A; text-decoration: none; border-radius: 0; font-weight: 900; font-size: 16px; box-shadow: 0 4px 8px rgba(0,0,0,0.3); transition: transform 0.2s; text-transform: uppercase; letter-spacing: 1px;"
       onmouseover="this.style.transform='translateY(-2px)'"
       onmouseout="this.style.transform='translateY(0)'">
        Bekijk Overzichtsdashboard →
    </a>
</div>

{{ block.super }}
{% endblock %}
