<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan Succesvol - {{ post.name }}</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: 'Arial Black', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #FF8247;
            min-height: 100vh;
            display: flex;
            align-items: stretch;
            justify-content: center;
        }
        .container {
            background-color: #3A3A3A;
            padding: 24px;
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .success-icon {
            font-size: 80px;
            text-align: center;
            margin-bottom: 16px;
        }
        h1 {
            color: #6BFF6B;
            margin: 0 0 8px 0;
            font-size: 32px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            line-height: 1.2;
            text-align: center;
        }
        .post-name {
            color: #FF8247;
            font-size: 24px;
            font-weight: 900;
            text-align: center;
            margin-bottom: 24px;
        }
        .description {
            color: white;
            margin-bottom: 32px;
            padding: 16px;
            background-color: #2C2C2C;
            border-left: 5px solid #FF8247;
            font-weight: normal;
            font-size: 16px;
            line-height: 1.5;
        }
        .group-info {
            color: white;
            margin-bottom: 24px;
            padding: 16px;
            background-color: #2C5C28;
            border-left: 5px solid #6BFF6B;
            font-size: 16px;
        }
        .download-btn {
            display: block;
            background-color: #FF8247;
            color: #3A3A3A;
            padding: 18px 24px;
            border: none;
            border-radius: 0;
            font-size: 20px;
            cursor: pointer;
            width: 100%;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
            text-decoration: none;
            transition: transform 0.1s;
            min-height: 56px;
            touch-action: manipulation;
        }
        .download-btn:active {
            transform: scale(0.98);
        }
        .messages {
            margin-bottom: 24px;
        }
        .message {
            padding: 16px;
            border-radius: 0;
            margin-bottom: 12px;
            font-weight: bold;
            border-left: 5px solid;
            font-size: 15px;
            line-height: 1.4;
        }
        .error {
            background-color: #5C2828;
            color: #FFB4B4;
            border-left-color: #FF6B6B;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="success-icon">✓</div>
        <h1>Scan Succesvol!</h1>
        <div class="post-name">{{ post.name }}</div>

        {% if messages %}
        <div class="messages">
            {% for message in messages %}
            <div class="message {{ message.tags }}">
                {{ message }}
            </div>
            {% endfor %}
        </div>
        {% endif %}

        {% if post.description %}
        <div class="description">
            {{ post.description }}
        </div>
        {% endif %}

        <div class="group-info">
            Geregistreerd voor: <strong>{{ group }}</strong>
        </div>

        {% if has_pdf %}
        <a href="{% url 'download_pdf' qr_code_identifier=post.qr_code_identifier group_id=group.id %}" class="download-btn">
            Download Instructies (PDF)
        </a>
        {% endif %}
    </div>
</body>
</html>
