<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tag een Groep</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: 'Arial Black', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #FF8247;
            min-height: 100vh;
            display: flex;
            align-items: stretch;
            justify-content: center;
        }
        .container {
            background-color: #3A3A3A;
            padding: 24px;
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        h1 {
            color: #FF8247;
            margin: 0 0 8px 0;
            font-size: 32px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            line-height: 1.2;
        }
        .description {
            color: white;
            margin-bottom: 32px;
            padding: 16px;
            background-color: #2C2C2C;
            border-left: 5px solid #FF8247;
            font-weight: normal;
            font-size: 16px;
            line-height: 1.5;
        }
        .form-group {
            margin-bottom: 24px;
        }
        label {
            display: block;
            margin-bottom: 12px;
            font-weight: 900;
            color: #FF8247;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 16px;
        }
        input[type="text"] {
            width: 100%;
            padding: 18px 16px;
            border: 3px solid #FF8247;
            border-radius: 0;
            font-size: 20px;
            background-color: #2C2C2C;
            color: white;
            font-weight: bold;
            appearance: none;
            -webkit-appearance: none;
            min-height: 56px;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #FF8247;
            box-shadow: 0 0 0 3px rgba(255, 130, 71, 0.3);
        }
        button {
            background-color: #FF8247;
            color: #3A3A3A;
            padding: 18px 24px;
            border: none;
            border-radius: 0;
            font-size: 20px;
            cursor: pointer;
            width: 100%;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: transform 0.1s;
            min-height: 56px;
            touch-action: manipulation;
        }
        button:active {
            transform: scale(0.98);
        }
        .messages {
            margin-bottom: 24px;
        }
        .message {
            padding: 16px;
            border-radius: 0;
            margin-bottom: 12px;
            font-weight: bold;
            border-left: 5px solid;
            font-size: 15px;
            line-height: 1.4;
        }
        .error {
            background-color: #5C2828;
            color: #FFB4B4;
            border-left-color: #FF6B6B;
        }
        .success {
            background-color: #2C5C28;
            color: #B4FFB4;
            border-left-color: #6BFF6B;
        }
        .info {
            background-color: #2C4C5C;
            color: #B4D4FF;
            border-left-color: #6BB4FF;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Tag een Groep</h1>
        <div class="description">
            Als tagger kun je hier groepen taggen. Elke tag kost de groep 1 punt. Voer je eigen naam en het wachtwoord van de groep in om een tag te registreren.
        </div>

        {% if messages %}
        <div class="messages">
            {% for message in messages %}
            <div class="message {{ message.tags }}">
                {{ message }}
            </div>
            {% endfor %}
        </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="tagger_name">Je naam:</label>
                <input type="text" id="tagger_name" name="tagger_name" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Groepswachtwoord:</label>
                <input type="text" id="password" name="password" required>
            </div>
            <button type="submit">Tag Groep</button>
        </form>
    </div>
</body>
</html>
